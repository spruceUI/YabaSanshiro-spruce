name: Build All

on:
  workflow_dispatch:
    inputs:
      yaba_version:
        description: 'YabaSanshiro version/tag/commit'
        default: 'a40dace1ae0af3ebd45848549fdf396f40e3930f'

permissions:
  contents: write

jobs:
  universal:
    uses: ./.github/workflows/build-universal.yml
    with:
      yaba_version: ${{ inputs.yaba_version }}
